[package]
name = "pulse-proxy"
version = "1.0.0"
description = "Modern, free & open-source Proxifier alternative for Windows"
authors = ["Nikita Kuznetsov <nimalekyt@gmail.com>"]
license = "MIT"
repository = "https://github.com/nimalekyt-bit/pulse-proxy"
edition = "2024"
rust-version = "1.90"

[lib]
name = "pulse_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
window-vibrancy = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
